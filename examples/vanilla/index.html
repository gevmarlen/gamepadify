<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gamepadify · Vanilla</title></head><body><h1>Vanilla JavaScript</h1><p>Press a controller button to start. On Xbox, X saves and A activates the focused card. Other controllers show their own button prompts.</p><button id="save" data-gamepad="xbox:x">Save</button><section><button data-gamepad-focusable>First card</button><button data-gamepad-focusable>Second card</button></section><output id="count">0 actions</output><script type="module" src="/main.ts"></script></body></html>
