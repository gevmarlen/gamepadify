name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: vars.NPM_PUBLISHING_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v'))
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.release_tag || github.ref }}
  publish:
    if: vars.NPM_PUBLISHING_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p "$RUNNER_TEMP/gamepadify-publisher"
          cp scripts/npm.mjs scripts/publish.mjs "$RUNNER_TEMP/gamepadify-publisher/"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:packages
      - run: node "$RUNNER_TEMP/gamepadify-publisher/publish.mjs" --provenance
        env:
          GAMEPADIFY_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
